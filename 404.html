<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the scope — Opportunity Radar</title>
<style>
:root{--ink:#06120b;--ink2:#0b1f14;--emerald:#10a35a;--lime:#c8f542;--gold:#ffb020;--tx:#eaf4ec;--mut:#9db8a6;--line:rgba(200,245,66,.16);--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 20px;color:var(--tx);background:radial-gradient(700px 400px at 80% -10%,rgba(58,166,255,.16),transparent 60%),radial-gradient(600px 380px at 10% 110%,rgba(16,163,90,.24),transparent 60%),linear-gradient(180deg,var(--ink),var(--ink2))}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--ink2)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--emerald),var(--ink2));border-radius:8px;border:2px solid var(--ink2)}
::-webkit-scrollbar-thumb:hover{background:var(--lime)}
html{scrollbar-color:var(--emerald) var(--ink2)}
::selection{background:var(--lime);color:var(--ink)}
.card{max-width:520px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:44px 34px;animation:rise .6s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.code{font-family:var(--mono);font-size:64px;font-weight:700;color:var(--gold);letter-spacing:.06em}
h1{font-size:24px;margin:8px 0 10px}
p{color:var(--mut);font-size:15px}
a{display:inline-block;margin-top:22px;background:var(--lime);color:var(--ink);font-weight:800;text-decoration:none;border-radius:10px;padding:12px 22px;font-size:14px;transition:.25s}
a:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(200,245,66,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="code">404</div>
  <h1>Nothing on the scope here.</h1>
  <p>This page is outside the radar's sweep. The brief, the sources and the pricing are all still one click away.</p>
  <a href="/opportunity-radar-site/">Return to base →</a>
</main>
</body>
</html>
